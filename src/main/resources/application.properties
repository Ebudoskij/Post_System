spring.application.name=post_system

# PostgreSQL (Relational DB)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/Post-System?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20

# MongoDB (Document NoSQL DB)
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/post_system_nosql
spring.data.mongodb.auto-index-creation=true
spring.mongodb.uri=mongodb://127.0.0.1:27017/post_system_nosql

# Redis (Key-Value NoSQL DB)
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
